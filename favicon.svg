<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#0b101d"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e9e7e2" stroke-opacity="0.08"/>

  <!-- ambient dot grid, echoes hero canvas -->
  <g fill="#5fb8b0" opacity="0.55">
    <circle cx="10" cy="10" r="1.1"/>
    <circle cx="18" cy="9" r="1.1"/>
    <circle cx="54" cy="12" r="1.1"/>
    <circle cx="9" cy="52" r="1.1"/>
    <circle cx="55" cy="53" r="1.1"/>
    <circle cx="47" cy="9" r="1.1"/>
    <circle cx="14" cy="55" r="1.1"/>
  </g>
  <g fill="#e0a458" opacity="0.75">
    <circle cx="53" cy="9" r="1.3"/>
    <circle cx="10" cy="45" r="1.3"/>
  </g>

  <!-- monogram: bracket-style "r" cursor glyph + 11 tally, terminal aesthetic -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="700">
    <text x="14" y="42" font-size="30" fill="#e9e7e2">r</text>
    <text x="30" y="42" font-size="30" fill="#e0a458">11</text>
  </g>

  <!-- cursor/caret accent underline, nods to terminal prompt -->
  <rect x="14" y="47" width="36" height="3" rx="1.5" fill="#5fb8b0" opacity="0.9"/>
</svg>
